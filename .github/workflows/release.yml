name: Release immutable images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
          - component: document-parser
            context: document-parser
          - component: embedding
            context: local-embedding
          - component: reranker
            context: local-reranker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cortex-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cortex-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Scan published immutable image
        run: |
          image='ghcr.io/${{ github.repository_owner }}/cortex-${{ matrix.component }}@${{ steps.build.outputs.digest }}'
          docker pull "$image"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$image"
      - name: Record deployable digest
        run: printf '%s@%s\n' 'ghcr.io/${{ github.repository_owner }}/cortex-${{ matrix.component }}' '${{ steps.build.outputs.digest }}' > '${{ matrix.component }}-image.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-image-digest
          path: ${{ matrix.component }}-image.txt
          retention-days: 90
