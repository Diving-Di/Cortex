model_list:
  - model_name: cortex-embedding
    litellm_params:
      model: openai/qwen3-embedding:0.6b
      api_base: os.environ/LOCAL_EMBEDDING_BASE_URL
      api_key: os.environ/LOCAL_EMBEDDING_API_KEY
      timeout: 60
  - model_name: diary-default
    litellm_params:
      model: openai/kimi-k2.5
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/KIMI_API_KEY
      timeout: 60
  - model_name: diary-deepseek-fallback
    litellm_params:
      model: deepseek/deepseek-chat
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      timeout: 60
  - model_name: diary-openai-fallback
    litellm_params:
      model: openai/gpt-5.6
      api_base: https://api.openai.com/v1
      api_key: os.environ/OPENAI_API_KEY
      timeout: 60

litellm_settings:
  cache: false
  drop_params: true
  num_retries: 1
  request_timeout: 60
  fallbacks:
    - diary-default:
        - diary-deepseek-fallback
        - diary-openai-fallback

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: false
  disable_error_logs: true
  enable_prometheus_metrics: true

router_settings:
  allowed_fails: 2
  cooldown_time: 30
