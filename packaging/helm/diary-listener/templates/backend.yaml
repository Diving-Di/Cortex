apiVersion: v1
kind: Service
metadata:
  name: {{ include "diary-listener.name" . }}-backend
  labels:
    {{- include "diary-listener.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "diary-listener.name" . }}-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diary-listener.name" . }}-backend
  labels:
    {{- include "diary-listener.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "diary-listener.name" . }}-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "diary-listener.name" . }}-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 100
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.backend.secretName }}, key: database-url}}
            - name: MIGRATION_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.backend.secretName }}, key: migration-database-url}}
            - name: AI_API_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.backend.secretName }}, key: litellm-virtual-key}}
            - {name: AI_BASE_URL, value: {{ .Values.backend.env.aiBaseUrl | quote }}}
            - {name: AI_MODEL, value: {{ .Values.backend.env.aiModel | quote }}}
            - {name: APP_ENV, value: {{ .Values.backend.env.appEnv | quote }}}
            - {name: CORS_ORIGINS, value: {{ .Values.backend.env.corsOrigins | quote }}}
            - {name: DIARY_DATA_DIR, value: /app/data}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: data, mountPath: /app/data}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "diary-listener.name" . }}-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "diary-listener.name" . }}-data
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: {{ .Values.backend.dataSize }}
