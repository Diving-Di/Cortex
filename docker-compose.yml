services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes: ["minio_data:/data"]
    expose: ["9000", "9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set cortex http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing cortex/cortex-private &&
        mc anonymous set none cortex/cortex-private &&
        (mc admin user add cortex "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" || true) &&
        mc admin policy attach cortex readwrite --user "$${MINIO_ACCESS_KEY}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    depends_on:
      minio: {condition: service_healthy}

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.5
    command: ["redpanda", "start", "--mode", "dev-container", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0", "--kafka-addr", "internal://0.0.0.0:9092", "--advertise-kafka-addr", "internal://kafka:9092", "--pandaproxy-addr", "0.0.0.0:8082", "--advertise-pandaproxy-addr", "kafka:8082"]
    volumes: ["kafka_data:/var/lib/redpanda/data"]
    expose: ["9092", "8082"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        (rpk topic create cortex.knowledge.index.v1 cortex.document.parsed.v1 cortex.search.projection.v1 cortex.audit.export.v1
        --brokers kafka:9092 --partitions 6 --replicas 1 || true) &&
        rpk cluster config set auto_create_topics_enabled false --api-urls kafka:9644
    depends_on:
      kafka: {condition: service_healthy}

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:?set ELASTICSEARCH_PASSWORD}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes: ["elasticsearch_data:/usr/share/elasticsearch/data"]
    expose: ["9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:${ELASTICSEARCH_PASSWORD} http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH='${REDIS_PASSWORD:-change-me}' redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  llm-gateway:
    image: ghcr.io/berriai/litellm:main-v1.77.7-stable@sha256:cc6255644a32511355bc53c5d4d0ca7b3c5df45ad881225ff57e8a88e083c563
    command:
      [
        "--config",
        "/app/config.yaml",
        "--port",
        "4000",
        "--num_workers",
        "1",
      ]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://cortex_litellm:${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}@db:5432/cortex_litellm
      - OPENAI_API_KEY=${OPENAI_API_KEY:?set OPENAI_API_KEY}
      - KIMI_API_KEY=${KIMI_API_KEY:?set KIMI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      - LOCAL_EMBEDDING_BASE_URL=${LOCAL_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      - LOCAL_EMBEDDING_API_KEY=${LOCAL_EMBEDDING_API_KEY:-ollama-local}
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.1-pg16-bookworm@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: cortex
      POSTGRES_USER: cortex_migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/20-schema.sql:ro
      - ./backend/internal/migrations/sql/000014_template_marketplace_ai_events.up.sql:/docker-entrypoint/internal/migrations/sql/000014_template_marketplace_ai_events.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex_migrator -d cortex"]
      timeout: 20s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-cortex-backend:local}
    build:
      context: ./backend
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-golang:1.26.6-alpine}
        ALPINE_RUNTIME_IMAGE: ${ALPINE_RUNTIME_IMAGE:-alpine:3.23}
    ports:
      - "127.0.0.1:8000:8000"
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    volumes:
      - app_data:/app/data
    environment:
      - DATABASE_URL=postgresql://cortex_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@db:5432/cortex
      - MIGRATION_DATABASE_URL=postgresql://cortex_migrator:${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD}@db:5432/cortex
      - CORS_ORIGINS=http://127.0.0.1:5173,http://localhost:5173
      - TRUST_PROXY_HEADERS=true
      - AUTH_LOGIN_IP_LIMIT=${AUTH_LOGIN_IP_LIMIT:-30}
      - AUTH_LOGIN_ACCOUNT_LIMIT=${AUTH_LOGIN_ACCOUNT_LIMIT:-10}
      - AUTH_REGISTER_IP_LIMIT=${AUTH_REGISTER_IP_LIMIT:-5}
      - AUTH_TOKEN_IP_LIMIT=${AUTH_TOKEN_IP_LIMIT:-15}
      - LISTEN_ADDRESS=0.0.0.0:8000
      - CORTEX_DATA_DIR=/app/data
      - STORAGE_BACKEND=minio
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_BUCKET=cortex-private
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      - EVENT_BUS=kafka
      - KAFKA_REST_URL=http://kafka:8082
      - RAG_RETRIEVAL_BACKEND=elasticsearch
      - ELASTICSEARCH_URLS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:?set ELASTICSEARCH_PASSWORD}
      - MAX_ATTACHMENT_BYTES=${MAX_ATTACHMENT_BYTES:-20971520}
      - RAG_EMBEDDING_API_KEY=${LITELLM_VIRTUAL_KEY:?set LITELLM_VIRTUAL_KEY}
      - RAG_EMBEDDING_BASE_URL=http://embedding-service:4000/v1
      - RAG_EMBEDDING_MODEL=iic/nlp_gte_sentence-embedding_chinese-small
      - RAG_EMBEDDING_DIMENSIONS=512
      - RAG_EMBEDDING_SEND_DIMENSIONS=${RAG_EMBEDDING_SEND_DIMENSIONS:-false}
      - RAG_RERANK_BASE_URL=${RAG_RERANK_BASE_URL:-http://reranker-service:8080}
      - RAG_RERANK_MODEL=BAAI/bge-reranker-v2-m3
      - RAG_RERANK_MIN_SCORE=${RAG_RERANK_MIN_SCORE:-0.5038954}
      - RAG_MIN_QUALIFIED_EVIDENCE=${RAG_MIN_QUALIFIED_EVIDENCE:-1}
      - RAG_VECTOR_TOP_K=${RAG_VECTOR_TOP_K:-15}
      - RAG_TITLE_TOP_K=${RAG_TITLE_TOP_K:-10}
      - RAG_KEYWORD_TOP_K=${RAG_KEYWORD_TOP_K:-5}
      - RAG_FUSION_TOP_K=${RAG_FUSION_TOP_K:-20}
      - RAG_CONTEXT_PARENT_TOP_K=${RAG_CONTEXT_PARENT_TOP_K:-4}
      - KNOWLEDGE_INDEX_BATCH_SIZE=${KNOWLEDGE_INDEX_BATCH_SIZE:-16}
      - KNOWLEDGE_INDEX_POLL_SECONDS=${KNOWLEDGE_INDEX_POLL_SECONDS:-5}
      - DOCUMENT_PARSER_URL=http://document-parser:8080
      - DOCUMENT_PARSER_TIMEOUT_SECONDS=${DOCUMENT_PARSER_TIMEOUT_SECONDS:-120}
      - AI_API_KEY=${LITELLM_VIRTUAL_KEY:?set LITELLM_VIRTUAL_KEY}
      - AI_BASE_URL=http://llm-gateway:4000/v1
      - AI_MODEL=cortex-default
      - AI_SYSTEM_PROMPT=${AI_SYSTEM_PROMPT:-你是一个温暖、贴心的 AI 助手。}
      - APP_ENV=${APP_ENV:-development}
      - CORTEX_RUNTIME_ROLE=${CORTEX_RUNTIME_ROLE:-all}
      - SCHEDULED_REPORTS_ENABLED=${SCHEDULED_REPORTS_ENABLED:-true}
      - SCHEDULED_REPORT_POLL_SECONDS=${SCHEDULED_REPORT_POLL_SECONDS:-60}
      - REDIS_URL=redis://default:${REDIS_PASSWORD:-change-me}@redis:6379/0
      - AI_EVENT_CLAIM_IP_LIMIT=${AI_EVENT_CLAIM_IP_LIMIT:-60}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - AUTH_DB_POOL_SIZE=${AUTH_DB_POOL_SIZE:-32}
      - AI_EVENT_CLAIM_CONCURRENCY=${AI_EVENT_CLAIM_CONCURRENCY:-16}
      - AI_EVENT_CLAIM_QUEUE_TIMEOUT_MS=${AI_EVENT_CLAIM_QUEUE_TIMEOUT_MS:-10000}
    depends_on:
      db:
        condition: service_healthy

  document-parser:
    image: ${DOCUMENT_PARSER_IMAGE:-cortex-document-parser:local}
    build:
      context: ./document-parser
      args:
        PYTHON_RUNTIME_IMAGE: ${PYTHON_312_IMAGE:-python:3.12-slim-bookworm}
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 128
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=512m,mode=1777"]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12

  embedding-service:
    image: ${EMBEDDING_IMAGE:-cortex-embedding:local}
    build:
      context: ./local-embedding
      args:
        MODEL_REVISION: 3c386e2c2c38680eaa38977bbf69c60d72fbf24f
        PYTHON_RUNTIME_IMAGE: ${PYTHON_311_IMAGE:-python:3.11-slim@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93}
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 256
    expose:
      - "4000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  reranker-service:
    image: ${RERANKER_IMAGE:-cortex-reranker:local}
    build:
      context: ./local-reranker
      args:
        RERANK_MODEL_REVISION: e099d4b9cdbd291b1569d416f19aaa6523570bc3
        PYTHON_RUNTIME_IMAGE: ${PYTHON_311_IMAGE:-python:3.11-slim@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93}
        TORCH_INDEX_URL: ${RERANK_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu130}
    gpus: all
    cpus: 4.0
    mem_limit: 8g
    pids_limit: 512
    environment:
      - RERANK_MODEL_PATH=/models/reranker
      - RERANK_DEVICE=${RERANK_DEVICE:-cuda}
      - RERANK_MAX_DOCUMENTS=20
      - RERANK_MAX_LENGTH=2048
      - RERANK_BATCH_SIZE=4
      - RERANK_CPU_THREADS=4
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  frontend:
    image: ${FRONTEND_IMAGE:-cortex-frontend:local}
    build:
      context: ./frontend
      args:
        NODE_BUILDER_IMAGE: ${NODE_BUILDER_IMAGE:-node:20-alpine}
        NGINX_RUNTIME_IMAGE: ${NGINX_RUNTIME_IMAGE:-nginx:1.27-alpine}
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0750
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    depends_on:
      backend: {condition: service_healthy}
      alertmanager: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:-./deploy/alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    expose: ["9093"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/cortex-dashboard.json:/var/lib/grafana/dashboards/cortex.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://cortex_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@db:5432/cortex?sslmode=disable
    expose: ["9187"]
    depends_on:
      db: {condition: service_healthy}

  redis-exporter:
    image: oliver006/redis_exporter:v1.77.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    expose: ["9121"]
    depends_on:
      redis: {condition: service_healthy}

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    expose: ["9308"]
    depends_on:
      kafka: {condition: service_healthy}

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0
    command: ["--es.uri=http://elastic:${ELASTICSEARCH_PASSWORD:?set ELASTICSEARCH_PASSWORD}@elasticsearch:9200"]
    expose: ["9114"]
    depends_on:
      elasticsearch: {condition: service_healthy}

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/textfile", "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|host/etc)($$|/)"]
    volumes:
      - /:/host:ro
      - app_data:/app-data:ro
      - metrics_data:/textfile:ro
    expose: ["9100"]

volumes:
  db_data:
    name: cortex_db_data_v2
    external: true
  app_data:
    name: cortex_app_data_v2
    external: true
  redis_data:
  minio_data:
  kafka_data:
  elasticsearch_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  metrics_data:
    name: cortex_metrics_data
