services:
  llm-gateway:
    image: ghcr.io/berriai/litellm:main-v1.77.7-stable@sha256:cc6255644a32511355bc53c5d4d0ca7b3c5df45ad881225ff57e8a88e083c563
    command:
      [
        "--config",
        "/app/config.yaml",
        "--port",
        "4000",
        "--num_workers",
        "1",
      ]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://diary_litellm:${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}@db:5432/diary_litellm
      - OPENAI_API_KEY=${OPENAI_API_KEY:?set OPENAI_API_KEY}
      - KIMI_API_KEY=${KIMI_API_KEY:?set KIMI_API_KEY}
      - LOCAL_EMBEDDING_BASE_URL=${LOCAL_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      - LOCAL_EMBEDDING_API_KEY=${LOCAL_EMBEDDING_API_KEY:-ollama-local}
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.1-pg16-bookworm@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
    environment:
      POSTGRES_DB: diary_listener
      POSTGRES_USER: diary_migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/20-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary_migrator -d diary_listener"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    ports:
      - "127.0.0.1:8000:8000"
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    volumes:
      - app_data:/app/data
    environment:
      - DATABASE_URL=postgresql://diary_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@db:5432/diary_listener
      - MIGRATION_DATABASE_URL=postgresql://diary_migrator:${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD}@db:5432/diary_listener
      - CORS_ORIGINS=http://127.0.0.1:5173,http://localhost:5173
      - LISTEN_ADDRESS=0.0.0.0:8000
      - DIARY_DATA_DIR=/app/data
      - MAX_ATTACHMENT_BYTES=${MAX_ATTACHMENT_BYTES:-20971520}
      - KNOWLEDGE_MAX_FILE_BYTES=${KNOWLEDGE_MAX_FILE_BYTES:-52428800}
      - KNOWLEDGE_MAX_PDF_PAGES=${KNOWLEDGE_MAX_PDF_PAGES:-500}
      - KNOWLEDGE_MAX_EXTRACTED_CHARS=${KNOWLEDGE_MAX_EXTRACTED_CHARS:-5000000}
      - RAG_INDEX_WORKERS=${RAG_INDEX_WORKERS:-2}
      - RAG_PARENT_TARGET_TOKENS=${RAG_PARENT_TARGET_TOKENS:-1800}
      - RAG_PARENT_MAX_TOKENS=${RAG_PARENT_MAX_TOKENS:-2500}
      - RAG_CHILD_TARGET_TOKENS=${RAG_CHILD_TARGET_TOKENS:-350}
      - RAG_CHILD_MAX_TOKENS=${RAG_CHILD_MAX_TOKENS:-500}
      - RAG_CHILD_OVERLAP_TOKENS=${RAG_CHILD_OVERLAP_TOKENS:-50}
      - RAG_EMBEDDING_BASE_URL=${RAG_EMBEDDING_BASE_URL:-http://llm-gateway:4000/v1}
      - RAG_EMBEDDING_API_KEY=${LITELLM_VIRTUAL_KEY:?set LITELLM_VIRTUAL_KEY}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-cortex-embedding}
      - RAG_EMBEDDING_DIMENSIONS=${RAG_EMBEDDING_DIMENSIONS:-1024}
      - RAG_EMBEDDING_SEND_DIMENSIONS=${RAG_EMBEDDING_SEND_DIMENSIONS:-false}
      - RAG_RERANK_BASE_URL=${RAG_RERANK_BASE_URL:-http://reranker-service:8080}
      - RAG_RERANK_MODEL=${RAG_RERANK_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      - AI_API_KEY=${LITELLM_VIRTUAL_KEY:?set LITELLM_VIRTUAL_KEY}
      - AI_BASE_URL=http://llm-gateway:4000/v1
      - AI_MODEL=diary-default
      - AI_SYSTEM_PROMPT=${AI_SYSTEM_PROMPT:-你是一个温暖、贴心的 AI 助手。}
      - APP_ENV=${APP_ENV:-development}
      - SCHEDULED_REPORTS_ENABLED=${SCHEDULED_REPORTS_ENABLED:-true}
      - SCHEDULED_REPORT_POLL_SECONDS=${SCHEDULED_REPORT_POLL_SECONDS:-60}
      - RESEARCH_ENABLED=${RESEARCH_ENABLED:-true}
      - RESEARCH_WORKERS=${RESEARCH_WORKERS:-1}
      - RESEARCH_MAX_KEYWORDS=${RESEARCH_MAX_KEYWORDS:-5}
      - RESEARCH_MAX_URLS=${RESEARCH_MAX_URLS:-30}
      - RESEARCH_MAX_RESULTS=${RESEARCH_MAX_RESULTS:-50}
      - RESEARCH_MAX_IMAGES=${RESEARCH_MAX_IMAGES:-20}
      - RESEARCH_MAX_IMAGE_BYTES=${RESEARCH_MAX_IMAGE_BYTES:-10485760}
      - RESEARCH_MAX_BODY_CHARS=${RESEARCH_MAX_BODY_CHARS:-100000}
      - RESEARCH_LEASE_SECONDS=${RESEARCH_LEASE_SECONDS:-300}
      - RESEARCH_MAX_ATTEMPTS=${RESEARCH_MAX_ATTEMPTS:-3}
      - RESEARCH_REQUEST_INTERVAL_MS=${RESEARCH_REQUEST_INTERVAL_MS:-1500}
      - RESEARCH_HTTP_TIMEOUT_SECONDS=${RESEARCH_HTTP_TIMEOUT_SECONDS:-20}
      - RESEARCH_OCR_URL=${RESEARCH_OCR_URL:-}
    depends_on:
      db:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy

  reranker-service:
    profiles: ["local-ai"]
    build:
      context: ./local-reranker
      args:
        RERANK_MODEL: Qwen/Qwen3-Reranker-0.6B
        RERANK_MODEL_REVISION: e61197ed45024b0ed8a2d74b80b4d909f1255473
    cpus: 4.0
    mem_limit: 8g
    pids_limit: 512
    environment:
      - RERANK_MODEL=Qwen/Qwen3-Reranker-0.6B
      - RERANK_MODEL_REVISION=e61197ed45024b0ed8a2d74b80b4d909f1255473
      - RERANK_MAX_DOCUMENTS=20
      - RERANK_MAX_LENGTH=2048
      - RERANK_BATCH_SIZE=4
      - RERANK_CPU_THREADS=4
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  app_data:
