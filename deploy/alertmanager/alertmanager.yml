# Safe local default: alerts remain visible in Alertmanager without contacting an
# external party. Production must point ALERTMANAGER_CONFIG_FILE at a reviewed
# receiver config and prove delivery before the release gate is closed.
route:
  receiver: local-only
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      repeat_interval: 30m
receivers:
  - name: local-only
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname]
